# All tunables live here. Override with `hvma --config path/to/other.yaml ...`.

paths:
  data_dir: data
  results_dir: results

dataset:
  name: Rapidata/text-2-image-Rich-Human-Feedback
  split: train
  n_samples: 40
  seed: 7
  # The 54 parquet shards are streamed in a seeded random order (no row shuffle buffer: it
  # needs ~10 GB RAM with these 1024x1024 heatmaps). keep_prob adds randomness within a shard.
  keep_prob: 0.25             # keep each streamed row with this probability
  require_heatmap: true       # ~30% of rows have no coherence_heatmap; they can't be evaluated
  heatmap_column: coherence_heatmap
  # Optional filter: keep only images whose normalised coherence score is below this
  # (i.e. images people found *incoherent*, so there is something to point at). null = no filter.
  max_coherence_score: null

heatmap:
  sigma_frac: 0.04            # gaussian sigma as a fraction of image width when turning points into a map
  topk_fracs: [0.1, 0.2, 0.3] # fractions of pixels kept when thresholding for IoU

model:
  name: openai/clip-vit-base-patch16   # patch16 -> 14x14 saliency grid; patch32 is faster but 7x7
  device: auto                         # auto | cpu | cuda | mps
  # Main methods (results/summary.csv). `center` is a model-free baseline: a gaussian at the
  # image centre. Human taps are strongly centre-biased, so every model must be read against it.
  methods: [gradcam, rollout, center]
  # The saliency target is the CLIP similarity to `positive` prompts minus `negative` prompts.
  positive_prompts:
    - "a photo with visual glitches, distorted artifacts and deformed objects"
    - "an AI-generated image with errors, extra fingers, warped text and broken geometry"
  negative_prompts:
    - "a clean, realistic, coherent photo with no errors"
  rollout_discard_ratio: 0.9           # drop the lowest 90% attention values per layer before rollout
  center_sigma_frac: 0.2               # `center` baseline: sigma as a fraction of image width

# Edge-bias ablation, reported separately (results/ablation.csv, figures/ablation_*.png).
# CLIP Grad-CAM puts most of its mass on the image border; each variant tests one explanation.
ablation:
  enabled: true
  gradcam_layers: [4, 6, 8, 10]        # gradcam_l<k>: Grad-CAM on the input of block k (main = 11, the last)
  outlier_norm_ratio: 2.0              # *_masked: patch tokens with norm > ratio x median count as
                                       # high-norm outliers and are in-painted from their neighbours
  register_models:                     # <name>_attn: last-layer CLS attention, without vs. with registers
    dinov2: facebook/dinov2-base
    dinov2reg: facebook/dinov2-with-registers-base

rapidata:
  audience_id: global
  job_name: "Human vs model attention — artefact localisation"
  instruction: "Tap on any part of the image that looks wrong, glitchy or artificial."
  responses_per_datapoint: 12
  max_datapoints: 40          # hard ceiling; `hvma run` refuses above this
  max_cost: 15.0              # in your billing currency; `hvma run` refuses above this
  raw_results_file: raw_locate.json
